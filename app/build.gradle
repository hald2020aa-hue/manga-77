plugins { id 'com.android.application' }

android {
    namespace 'com.mangaxw.clean'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mangaxw.clean'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
// Intentional: No ads, billing, analytics, proprietary or third-party SDKs.
